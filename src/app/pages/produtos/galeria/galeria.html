@if (fotos().length === 0) {
  <!-- Sem foto: mesmo placeholder das seções de destaque, para o cartão não
       abrir com um vazio sem explicação. -->
  <div class="media-ph media-ph--capa aspect-[4/3] w-full">
    <div class="flex flex-col items-center gap-3">
      <app-icon [name]="icone()" class="h-10 w-10 text-subtle" />
      <span class="font-geist-mono text-xs uppercase tracking-widest text-subtle"
        >Foto — {{ rotulo() }}</span
      >
    </div>
  </div>
} @else {
  <!-- `group` só para as setas aparecerem no hover do quadro. -->
  <div class="group relative border-b border-soft">
    <div class="ds-stack aspect-[4/3] w-full overflow-hidden bg-neutral-100">
      @for (foto of fotos(); track foto.src; let i = $index) {
        <!--
          Todas no DOM e a visível por opacidade: a troca dissolve.
          `aria-hidden` nas escondidas para o leitor de tela não anunciar as
          quatro fotos como se estivessem todas à mostra.
        -->
        <img
          class="h-full w-full object-cover transition-opacity duration-500 ease-out"
          [class.opacity-0]="i !== atual()"
          [src]="foto.src"
          [alt]="foto.alt"
          [attr.aria-hidden]="i === atual() ? null : 'true'"
          loading="lazy"
          decoding="async"
        />
      }
    </div>

    @if (temGaleria()) {
      <!-- Setas: aparecem no hover e no foco pelo teclado (`focus-within`), e
           são sempre clicáveis no toque, onde hover não existe. -->
      <div
        class="pointer-events-none absolute inset-x-3 top-1/2 flex -translate-y-1/2 justify-between opacity-0 transition-opacity duration-200 group-focus-within:opacity-100 group-hover:opacity-100 max-md:opacity-100"
      >
        <button
          type="button"
          class="pointer-events-auto grid h-9 w-9 place-items-center rounded-full border border-soft bg-white text-ink shadow-sm transition-all hover:bg-neutral-100 hover:shadow-md"
          [attr.aria-label]="'Foto anterior de ' + rotulo()"
          (click)="avancar(-1)"
        >
          <app-icon name="chevron-left" class="h-4 w-4" />
        </button>
        <button
          type="button"
          class="pointer-events-auto grid h-9 w-9 place-items-center rounded-full border border-soft bg-white text-ink shadow-sm transition-all hover:bg-neutral-100 hover:shadow-md"
          [attr.aria-label]="'Próxima foto de ' + rotulo()"
          (click)="avancar(1)"
        >
          <app-icon name="chevron-right" class="h-4 w-4" />
        </button>
      </div>

      <!-- Contador: redundante para quem vê as miniaturas, mas é o que informa a
           posição sem depender de contá-las. -->
      <span
        class="absolute bottom-3 right-3 rounded-full bg-neutral-900/50 px-2.5 py-1 font-geist-mono text-xs text-white"
        aria-hidden="true"
        >{{ atual() + 1 }}/{{ fotos().length }}</span
      >
    }
  </div>

  @if (temGaleria()) {
    <div
      class="flex gap-2 px-6 pt-6 sm:px-8"
      role="group"
      [attr.aria-label]="'Fotos de ' + rotulo()"
    >
      @for (foto of fotos(); track foto.src; let i = $index) {
        <button
          type="button"
          class="galeria-miniatura h-16 w-20 shrink-0 overflow-hidden rounded-lg border transition-all"
          [class]="
            i === atual() ? 'galeria-miniatura--ativa' : 'border-soft opacity-70 hover:opacity-100'
          "
          [attr.aria-current]="i === atual()"
          [attr.aria-label]="'Ver foto ' + (i + 1) + ': ' + foto.alt"
          (click)="ir(i)"
        >
          <img class="h-full w-full object-cover" [src]="foto.src" alt="" loading="lazy" />
        </button>
      }
    </div>
  }
}
