<div id="solucoes">
  @for (cat of categorias; track cat.id; let i = $index) {
    <section class="scroll-mt-16 px-6 sm:px-8" [class]="classes(i)" [id]="'solucao-' + cat.id">
      <div class="mx-auto max-w-6xl py-24">
        <div class="mb-10 flex items-center gap-3">
          <span class="font-geist-mono text-xs font-bold uppercase tracking-widest text-subtle"
            >0{{ i + 1 }} — {{ cat.nome }}</span
          >
          <div class="rule-soft h-px flex-1"></div>
        </div>

        <div class="grid grid-cols-1 items-center gap-12 lg:grid-cols-12 lg:gap-16">
          <!-- Área de imagem (placeholder até termos as fotos) -->
          <div class="lg:col-span-6" [class]="ordemMidia(i)">
            <div class="media-ph aspect-[4/3] w-full">
              <div class="flex flex-col items-center gap-3">
                <app-icon [name]="cat.icone" class="h-10 w-10 text-subtle" />
                <span class="font-geist-mono text-xs uppercase tracking-widest text-subtle"
                  >Imagem — {{ cat.nome }}</span
                >
              </div>
            </div>
          </div>

          <!-- Texto -->
          <div class="lg:col-span-6" [class]="ordemTexto(i)">
            <h2 class="mb-5 text-3xl font-semibold tracking-tight text-ink md:text-4xl">
              {{ cat.nome }}
            </h2>
            <p class="mb-8 font-geist-mono text-base leading-relaxed text-muted">
              {{ cat.descricao }}
            </p>

            <ul class="mb-10 space-y-3">
              @for (produto of cat.produtos; track produto) {
                <li class="flex items-center gap-3">
                  <app-icon name="check" class="h-4 w-4 shrink-0 text-ink" />
                  <span class="font-geist-mono text-sm text-muted">{{ produto }}</span>
                </li>
              }
            </ul>

            <div class="flex flex-wrap items-center gap-4">
              <a
                class="btn-primary inline-flex items-center gap-2 rounded-lg px-6 py-3 font-geist-mono text-sm font-medium transition-colors"
                href="#produtos"
              >
                Ver produtos
                <app-icon name="arrow-right" class="h-4 w-4" />
              </a>
              <a
                class="btn-ghost inline-flex items-center gap-2 rounded-lg border border-soft px-6 py-3 font-geist-mono text-sm font-medium transition-colors"
                href="#contato"
              >
                Solicitar orçamento
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  }
</div>
