<div class="sec sobre">
  <span class="wf-section-name">Sobre Nós</span>

  <div class="wrap">
    <header class="sobre__head">
      <span class="wf-tag">Eyebrow</span>
      <div class="wf-bar wf-bar--title"></div>
      <div class="wf-lines">
        <div class="wf-bar wf-bar--80"></div>
        <div class="wf-bar wf-bar--60"></div>
      </div>
    </header>

    <div class="sobre__grid">
      @for (p of pilares; track p) {
        <article class="wf-card sobre__pilar">
          <div class="wf-bar wf-bar--40"></div>
          <div class="wf-lines">
            <div class="wf-bar"></div>
            <div class="wf-bar wf-bar--80"></div>
          </div>
        </article>
      }
    </div>

    <div class="sobre__diferencial">
      <div class="sobre__diferencial-text">
        <div class="wf-bar wf-bar--sub"></div>
        <div class="wf-lines">
          <div class="wf-bar"></div>
          <div class="wf-bar wf-bar--80"></div>
        </div>
      </div>
      <div class="wf-box sobre__media">Imagem</div>
    </div>
  </div>
</div>
